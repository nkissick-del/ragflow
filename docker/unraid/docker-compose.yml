services:
  ragflow:
    image: ${RAGFLOW_IMAGE}
    container_name: ragflow-server
    restart: unless-stopped
    depends_on:
      docling:
        condition: service_healthy
    # Connects to the external Postgres network + internal bridge
    networks:
      - ragflow
      - postgresql
    # Expose ports to Unraid Host (NPM will proxy to SVR_HTTP_PORT)
    ports:
      - "${SVR_HTTP_PORT}:9380"
    #  - "${SVR_WEB_HTTP_PORT}:80" # Optional: if you want direct access to the web UI without NPM for testing
    environment:
      - TZ=${TZ}
      - DOCLING_BASE_URL=${DOCLING_BASE_URL}
      # Database Configuration (mapped from .env to service_conf via templating or direct file)
      # RAGFlow v0.16+ typically uses service_conf.yaml, but we inject some ENVs just in case
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      # Data Persistence
      - /mnt/user/appdata/ragflow/logs:/ragflow/logs
      # Configuration (Mounting the Nathan specific config as the active one)
      - ./service_conf.yaml.nathan:/ragflow/conf/service_conf.yaml
      # Dependencies (optional, for caching)
      - /mnt/user/appdata/ragflow/deps:/opt/ragflow/.deps
      - /mnt/user/appdata/ragflow/pip-cache:/root/.cache/pip
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9380/v1/system/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${RAGFLOW_MEM_LIMIT}

  docling:
    image: ${DOCLING_IMAGE}
    container_name: ragflow-docling
    restart: unless-stopped
    ports:
      - "${DOCLING_PORT}:5001"
    environment:
      - PORT=5001
      - DOCLING_SERVE_ENABLE_UI=${DOCLING_SERVE_ENABLE_UI}
      - APP_UID=99   # Unraid "nobody" user usually
      - APP_GID=100  # Unraid "users" group usually
    volumes:
      - /mnt/user/appdata/ragflow/docling/models:/app/models
    networks:
      - ragflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${DOCLING_MEM_LIMIT}
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  ragflow:
    driver: bridge
  postgresql:
    external: true
    name: postgresql
