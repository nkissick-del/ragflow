[project]
name = "ragflow"
version = "0.23.1"
description = "[RAGFlow](https://ragflow.io/) is an open-source RAG (Retrieval-Augmented Generation) engine based on deep document understanding. It offers a streamlined RAG workflow for businesses of any scale, combining LLM (Large Language Models) to provide truthful question-answering capabilities, backed by well-founded citations from various complex formatted data."
authors = [{ name = "Zhichang Yu", email = "yuzhichang@gmail.com" }]
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # =============================================================================
    # CORE DEPENDENCIES (~15 packages - truly minimal)
    # =============================================================================

    # Web framework
    "quart>=0.20.0",
    "quart-auth==0.11.0",
    "quart-cors==0.8.0",
    "quart-schema==0.23.0",
    "flask-cors==6.0.2",
    "flask-login==0.6.3",
    "flask-mail>=0.10.0",
    "flask-session==0.8.0",
    "flasgger>=0.9.7.1",

    # Core utilities
    "beartype>=0.20.0",
    "ruamel-yaml>=0.18.6",
    "ruamel-base==1.0.0",
    "strenum==0.4.15",
    "json-repair==0.35.0",
    "ormsgpack==1.5.0",
    "demjson3==3.0.6",
    "markdown==3.6",
    "pycryptodomex==3.20.0",
    "captcha>=0.7.1",
    "editdistance==0.8.1",
    "aiosmtplib>=5.0.0",
    "chardet>=5.2.0",
    "numpy>=1.26.0",
    "Pillow>=10.4.0",

    # Database ORM
    "peewee>=3.17.1",
    "minio==7.2.4",

    # Required services (valkey is the Python client library that talks to Redis sidecar)
    # Used for: caching, rate limiting, task coordination, health checks
    "valkey==6.0.2",

    # Core NLP (lightweight)
    "cn2an==0.5.22",
    "word2number==1.1",
    "xpinyin==0.7.6",

    # Plugin system
    "pluginlib==0.9.4",
    "nest-asyncio>=1.6.0",
    "exceptiongroup>=1.3.0",

    # Media processing (lightweight)
    "ffmpeg-python>=0.2.0",
    "pypandoc>=1.16",

    # Bioinformatics (lightweight)
    "bio==1.7.1",

    # Roman numeral support
    "roman-numbers==1.0.2",

    # PDF generation (used for reports)
    "reportlab>=4.4.1",

    # Socks proxy support
    "socksio==1.0.0",
]

[project.optional-dependencies]

# =============================================================================
# APPLICATION DATABASE (choose ONE)
# =============================================================================
db-postgres = ["psycopg2-binary>=2.9.11"]
db-mysql = ["pymysql>=1.1.1"]

# =============================================================================
# OBJECT STORAGE (choose ONE or more)
# =============================================================================
storage-minio = []  # minio is included in core dependencies (minio==7.2.4) — no additional packages provided
storage-s3 = ["mypy-boto3-s3==1.40.26"]
storage-azure = ["azure-identity==1.17.1", "azure-storage-file-datalake==12.16.0"]
storage-opendal = ["opendal>=0.45.0"]
storage-webdav = ["webdav4>=0.10.0"]

# =============================================================================
# VECTOR STORES (choose ONE)
# =============================================================================
vectorstore-elasticsearch = ["elasticsearch-dsl==8.12.0"]
vectorstore-opensearch = ["opensearch-py==2.7.1"]
vectorstore-infinity = ["infinity-sdk==0.7.0-dev2"]  # 0.7.0-dev2 required for latest gRPC; revisit once 0.7.0 stable is available (as of Jan 2026, 0.6.15 is latest stable)
vectorstore-postgres = ["psycopg2-binary>=2.9.11"]
vectorstore-oceanbase = ["pyobvector==0.2.22"]

# =============================================================================
# DOCUMENT PROCESSING - DEEPDOC (optional - alternative is Docling sidecar)
# =============================================================================
# If using Docling sidecar, you can skip this entire group
deepdoc = [
    # PDF processing
    "pdfplumber==0.10.4",
    "pypdf>=6.6.2",
    "pypdf2>=3.0.1",
    "tika==2.6.0",

    # Office documents
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "python-calamine>=0.4.0",
    "mammoth>=1.11.0",
    "aspose-slides==24.7.0; platform_machine == 'x86_64' or (sys_platform == 'darwin' and platform_machine == 'arm64')",

    # Email processing
    "extract-msg>=0.39.0",

    # Computer vision & ML
    "opencv-python-headless==4.10.0.84",
    "onnxruntime==1.23.2; sys_platform == 'darwin' or sys_platform == 'win32' or platform_machine != 'x86_64'",
    "onnxruntime-gpu==1.23.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "xgboost>=2.0.0",
    "pyclipper>=1.4.0",

    # HTML processing
    "html-text==0.6.2",
    "readability-lxml>=0.8.4",
]

# =============================================================================
# LLM PROVIDERS
# =============================================================================
llm-anthropic = ["anthropic==0.34.1"]
llm-google = ["google-genai>=1.41.0", "vertexai==1.70.0"]
llm-cohere = ["cohere==5.6.2"]
llm-mistral = ["mistralai==0.4.2"]
llm-baidu = ["qianfan==0.4.6"]
llm-alibaba = ["dashscope==1.20.11"]
llm-volcengine = ["volcengine==1.0.194"]
llm-zhipu = ["zhipuai==2.0.1"]
llm-groq = ["groq==0.9.0"]
llm-replicate = ["replicate==0.31.0"]
llm-voyage = ["voyageai==0.2.3"]
llm-ollama = ["ollama>=0.5.0"]
llm-hunyuan = ["tencentcloud-sdk-python==3.0.1478"]
llm-all = [
    "ragflow[llm-anthropic,llm-google,llm-cohere,llm-mistral,llm-baidu]",
    "ragflow[llm-alibaba,llm-volcengine,llm-zhipu,llm-groq,llm-replicate]",
    "ragflow[llm-voyage,llm-ollama,llm-hunyuan,grpc]",
]

# gRPC support (used by various components, e.g. infinity-sdk)
grpc = ["grpcio-status==1.67.1"]

# =============================================================================
# INTEGRATIONS / CONNECTORS
# =============================================================================
integrations-jira = ["jira==3.10.5", "atlassian-python-api==4.0.7"]
integrations-slack = ["slack-sdk==3.37.0"]
integrations-discord = ["discord-py==2.3.2"]
integrations-github = ["pygithub>=2.8.1"]
integrations-gitlab = ["python-gitlab>=7.0.0"]
integrations-google = ["google-api-python-client>=2.150.0", "google-auth-oauthlib>=1.2.0"]
integrations-box = ["boxsdk>=10.1.0"]
integrations-dropbox = ["dropbox==12.0.2"]
integrations-asana = ["asana>=5.2.2"]
integrations-airtable = ["pyairtable>=3.3.0"]
integrations-office365 = ["Office365-REST-Python-Client==2.6.2"]
integrations-moodle = ["moodlepy>=0.23.0", "markdownify>=1.2.0"]
integrations-all = [
    "ragflow[integrations-jira,integrations-slack,integrations-discord]",
    "ragflow[integrations-github,integrations-gitlab,integrations-google]",
    "ragflow[integrations-box,integrations-dropbox,integrations-asana]",
    "ragflow[integrations-airtable,integrations-office365,integrations-moodle]",
]

# =============================================================================
# SEARCH / WEB TOOLS
# =============================================================================
search-tavily = ["tavily-python==0.5.1"]
search-serp = ["google-search-results==2.4.2"]
search-duckduckgo = ["duckduckgo-search>=7.2.0"]
search-scholar = ["scholarly==1.7.11", "arxiv==2.1.3"]
search-crawl = ["Crawl4AI>=0.4.0", "selenium-wire==5.1.0", "webdriver-manager==4.0.1"]
search-wikipedia = ["wikipedia==1.4.0"]
search-all = [
    "ragflow[search-tavily,search-serp,search-duckduckgo,search-scholar,search-crawl,search-wikipedia]",
]

# =============================================================================
# GRAPH RAG
# =============================================================================
graphrag = [
    # TODO: Revisit once upstream graspologic adopts modern build standards.
    # Tracked at: https://github.com/microsoft/graspologic/issues/1105
    "graspologic @ git+https://github.com/yuzhichang/graspologic.git@38e680cab72bc9fb68a7992c3bcc2d53b24e42fd",
    "ranx==0.3.20",
    "markdown-to-json==2.1.1",
]

# =============================================================================
# AGENT TOOLS
# =============================================================================
agent-tools = ["mcp>=1.19.0", "agentrun-sdk>=0.0.16", "mini-racer>=0.12.4"]
agent-sql = ["sqlglotrs==0.9.0", "pyodbc>=5.2.0"]
agent-translation = ["deepl==1.18.0"]

# =============================================================================
# EMBEDDINGS
# =============================================================================
embeddings = ["infinity-emb>=0.0.66"]

# =============================================================================
# FINANCE (specialized)
# =============================================================================
finance-china = ["akshare>=1.15.78"]
finance-global = ["yfinance==0.2.65"]

# =============================================================================
# OBSERVABILITY
# =============================================================================
observability = ["langfuse>=2.60.0"]

# =============================================================================
# CONVENIENCE GROUPS
# =============================================================================

# Full installation (backward compatible - includes everything)
all = [
    "ragflow[db-postgres,storage-minio,storage-s3,storage-azure,storage-opendal,storage-webdav]",
    "ragflow[vectorstore-elasticsearch,vectorstore-opensearch,vectorstore-infinity,vectorstore-postgres,vectorstore-oceanbase]",
    "ragflow[deepdoc]",
    "ragflow[llm-all,integrations-all,search-all]",
    "ragflow[graphrag,agent-tools,agent-sql,agent-translation]",
    "ragflow[embeddings,finance-china,finance-global,observability,grpc]",
]

# Minimal for Docling sidecar users (no deepdoc, no heavy ML deps)
# Includes default LLM provider for basic functionality
docling-sidecar = [
    "ragflow[db-postgres,storage-s3,vectorstore-elasticsearch,llm-openai]",
]

# Full-featured but lightweight (no deepdoc, uses pgvector for single-DB simplicity)
# Includes: all LLMs, all integrations, search, graphrag, agent tools, observability
full-lite = [
    "ragflow[db-postgres,storage-s3,vectorstore-postgres]",
    "ragflow[llm-all,integrations-all,search-all]",
    "ragflow[graphrag,agent-tools,agent-sql,agent-translation]",
    "ragflow[observability]",
]

# Testing dependencies
test = [
    "hypothesis>=6.132.0",
    "openpyxl>=3.1.5",
    "pillow>=10.4.0,<13.0.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.0.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "requests>=2.32.2",
    "requests-toolbelt>=1.0.0",
]

# Development (includes test deps)
dev = [
    "ragflow[all,test]",
]

# Environment-agnostic dependency groups (PEP 735)
# Note: The "test" group here is a bridge that references project.optional-dependencies "test"
# to ensure compatibility with tools that strictly expect dependency-groups (like uv or some CI).
[dependency-groups]
test = [
    "ragflow[test]",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.setuptools]
packages = [
    'agent',
    'api',
    'deepdoc',
    'graphrag',
    'intergrations.chatgpt-on-wechat.plugins',
    'mcp.server',
    'rag',
    'sdk.python.ragflow_sdk',
]

[tool.ruff]
line-length = 200
exclude = [".venv", "rag/svr/discord_svr.py"]

[tool.ruff.lint]
extend-select = ["ASYNC", "ASYNC1"]
ignore = ["E402"]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "p1: high priority test cases",
    "p2: medium priority test cases",
    "p3: low priority test cases",
]

# Test collection and runtime configuration
filterwarnings = [
    "error",  # Treat warnings as errors
    "ignore::DeprecationWarning",  # Ignore specific warnings
]

# Command line options
addopts = [
    "-v",  # Verbose output
    "--strict-markers",  # Enforce marker definitions
    "--tb=short",  # Simplified traceback
    "--disable-warnings",  # Disable warnings
    "--color=yes"  # Colored output
]


# Coverage configuration
[tool.coverage.run]
# Source paths - adjust according to your project structure
source = [
    # "../../api/db/services",
    # Add more directories if needed:
    "../../common",
    # "../../utils",
]

# Files/directories to exclude
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.pytest_cache/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
    "*/site-packages/*",
    "*/dist/*",
    "*/build/*",
    "*/migrations/*",
    "setup.py"
]

[tool.coverage.report]
# Report configuration
precision = 2
show_missing = true
skip_covered = false
fail_under = 0  # Minimum coverage requirement (0-100)

# Lines to exclude (optional)
exclude_lines = [
#    "pragma: no cover",
#    "def __repr__",
#    "raise AssertionError",
#    "raise NotImplementedError",
#    "if __name__ == .__main__.:",
#    "if TYPE_CHECKING:",
    "pass"
]

[tool.coverage.html]
# HTML report configuration
directory = "htmlcov"
title = "Test Coverage Report"
# extra_css = "custom.css"  # Optional custom CSS
